{% comment %}
Pill button (DESIGN.md: 48px radius, cobalt fill for primary).
Params: label, variant ("primary"|"ghost", default "primary"), type ("button"|"submit"), href
{% endcomment %}
{% if href %}
  <a href="{{ href }}"
     class="inline-flex items-center justify-center rounded-full px-24 py-12 text-body-sm font-medium transition
            {% if variant == 'ghost' %}border border-hairline bg-pure-white text-ink-charcoal hover:border-powder-blue
            {% else %}bg-electric-cobalt text-pure-white hover:bg-deep-cobalt{% endif %}">
    {{ label }}
  </a>
{% else %}
  <button type="{{ type|default:'button' }}"
          class="inline-flex items-center justify-center rounded-full px-24 py-12 text-body-sm font-medium transition
                 {% if variant == 'ghost' %}border border-hairline bg-pure-white text-ink-charcoal hover:border-powder-blue
                 {% else %}bg-electric-cobalt text-pure-white hover:bg-deep-cobalt{% endif %}">
    {{ label }}
  </button>
{% endif %}
