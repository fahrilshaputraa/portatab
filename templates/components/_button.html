{% comment %}
Link styled as a pill button. Styles live in the `.btn` component classes so the
design tokens are defined once (see static/css/input.css).

Params:
  label   — button text
  href    — destination (required; use <button class="btn btn-primary"> for submits)
  variant — "primary" | "ghost" | "dark" | "danger" (default "primary")
  size    — "sm" | "md" | "lg" (default "md")
  block   — truthy makes it full width

{% endcomment %}
<a href="{{ href }}"
   class="btn btn-{{ variant|default:'primary' }}{% if size == 'sm' %} btn-sm{% elif size == 'lg' %} btn-lg{% endif %}{% if block %} btn-block{% endif %}">{{ label }}</a>
