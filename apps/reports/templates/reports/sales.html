{% extends "tenants/base_dashboard.html" %}

{% block title %}Laporan Penjualan — PortaTap{% endblock %}

{% block content %}
<div class="mx-auto max-w-page">
  <div class="flex flex-wrap items-center justify-between gap-16">
    <h1 class="text-heading-lg font-semibold text-ink-charcoal">Laporan Penjualan</h1>
    <a href="{% url 'reports:export_csv' %}?start={{ start|date:'Y-m-d' }}&end={{ end|date:'Y-m-d' }}"
       class="btn btn-ghost">Ekspor CSV</a>
  </div>

  <form class="mt-24 flex flex-wrap items-end gap-12"
        hx-get="{% url 'reports:sales' %}" hx-target="#report-region" hx-swap="outerHTML" hx-trigger="change, submit">
    <label class="flex flex-col gap-4 text-body-sm">
      Dari
      <input type="date" name="start" value="{{ start|date:'Y-m-d' }}"
             class="rounded-2xl border border-hairline bg-pure-white px-16 py-8">
    </label>
    <label class="flex flex-col gap-4 text-body-sm">
      Sampai
      <input type="date" name="end" value="{{ end|date:'Y-m-d' }}"
             class="rounded-2xl border border-hairline bg-pure-white px-16 py-8">
    </label>
    <button type="submit" class="btn btn-primary">Terapkan</button>
  </form>

  <div class="mt-24">
    {% include "reports/_report.html" %}
  </div>
</div>
{% endblock %}
